<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>فتح الوردية</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body class="bg-slate-100 h-screen flex items-center justify-center">

<div id="app" class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">

    <h1 class="text-3xl font-bold text-center mb-8">

        فتح وردية جديدة

    </h1>

    <div class="space-y-6">

        <input

            v-model="openingCash"

            type="number"

            placeholder="الرصيد الافتتاحي"

            class="w-full border rounded-xl p-4 text-center text-xl"

        >

        <button

            @click="openShift"

            :disabled="loading"

            class="w-full bg-emerald-600 text-white p-4 rounded-xl text-xl"

        >

            {{ loading ? 'جاري الفتح...' : 'فتح الوردية' }}

        </button>

    </div>

</div>

<script>

const {createApp,ref,onMounted}=Vue;

createApp({

setup(){

const openingCash=ref(0);

const loading=ref(false);

const api='https://pharmaflow-api-1.1.0-beta-main.test/api';

const token=localStorage.getItem('token');

const openShift=async()=>{

    loading.value=true;

    try{

        await axios.post(

        api+'/shift/open',

        {

        opening_cash:openingCash.value

        },

        {

        headers:{

        Authorization:'Bearer '+token

        }

    }

);

    window.location='pos.html';

}

catch(e){

alert(

e.response?.data?.message||

'تعذر فتح الوردية'

);

}

finally{

loading.value=false;

}

};

onMounted(async()=>{

try{

const res=

    await axios.get(

        api+'/shift/current',

        {

            headers:{

            Authorization:'Bearer '+token

            }

        }

    );

    if(res.data.opened){

    window.location='pos.html';

    }

}

catch(e){}

});

    return{

        openingCash,

        loading,

        openShift

    };

}

}).mount('#app');

</script>

</body>

</html>
